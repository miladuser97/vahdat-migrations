name: Test Storage Real (Test Project Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-storage:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      NODE_ENV: test
      TEST_SUPABASE_URL: ${{ secrets.TEST_SUPABASE_URL }}
      TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify secrets exist
        run: |
          if [ -z "$TEST_SUPABASE_URL" ]; then
            echo "Secrets check failed: TEST_SUPABASE_URL missing"
            exit 1
          fi
          if [ -z "$TEST_SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "Secrets check failed: TEST_SUPABASE_SERVICE_ROLE_KEY missing"
            exit 1
          fi
          echo "Secrets present"

      - name: Verify URL is test project (strict)
        run: |
          node -e "
          const url = process.env.TEST_SUPABASE_URL;
          let parsed;
          try { parsed = new URL(url); } catch { console.error('Error [URL_FORMAT_INVALID]'); process.exit(1); }
          
          if (parsed.protocol !== 'https:') { console.error('Error [URL_PROTOCOL_INVALID]'); process.exit(1); }
          if (parsed.username || parsed.password) { console.error('Error [URL_HAS_CREDENTIALS]'); process.exit(1); }
          if (parsed.port && parsed.port !== '443') { console.error('Error [URL_HAS_CUSTOM_PORT]'); process.exit(1); }
          if (parsed.search) { console.error('Error [URL_HAS_QUERY]'); process.exit(1); }
          if (parsed.hash) { console.error('Error [URL_HAS_FRAGMENT]'); process.exit(1); }
          
          const hostname = parsed.hostname.toLowerCase();
          
          // اول Production رو رد کن (قبل از hostname mismatch)
          if (hostname === 'bcmhykiruwbgovaxnwzr.supabase.co' || hostname.includes('bcmhykiruwbgovaxnwzr')) {
            console.error('Error [URL_IS_PRODUCTION]');
            process.exit(1);
          }
          
          // بعد hostname دقیق
          if (hostname !== 'whrfzvzysehggsqovqqj.supabase.co') {
            console.error('Error [URL_HOST_MISMATCH]');
            process.exit(1);
          }
          
          console.log('URL verified: test project only');
          "

      - name: Remove old lockfile (CI only)
        run: rm -f package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Run storage real test
        run: npx tsx scripts/media/test-storage-real.ts