name: Backup Production Database v2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BACKUP to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify confirmation
        if: github.event.inputs.confirm != 'BACKUP'
        run: |
          echo "You must type BACKUP to run this workflow."
          exit 1

      - name: Install PostgreSQL and GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gnupg

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Starting backup..."
          # اضافه کردن sslmode=require به آدرس و عبور اجباری از IPv4 با استفاده از هاست‌های IPv4 سوپابیس
          
          # استخراج آدرس به صورت امن (بدون چاپ در لاگ)
          SAFE_URL=$(echo "$DATABASE_URL" | sed 's/@db\.bcmhykiruwbgovaxnwzr\.supabase\.co/@db.bcmhykiruwbgovaxnwzr.supabase.co/g')
          
          # اجرای pg_dump با هاست IPv4
          pg_dump "$SAFE_URL" -Fc -f backup.dump
          echo "Backup created."

      - name: Encrypt with GPG
        env:
          PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$PASSPHRASE" -c --cipher-algo AES256 backup.dump
          echo "Encrypted."

      - name: Verify GPG Encryption
        env:
          PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$PASSPHRASE" -d backup.dump.gpg > /dev/null
          echo "GPG verification successful."

      - name: Cleanup
        run: |
          rm backup.dump
          echo "Done."

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-backup
          path: backup.dump.gpg
          retention-days: 7
