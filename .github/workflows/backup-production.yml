name: Backup Production Database v2

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type BACKUP to confirm'
        required: true
        type: string

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Verify confirmation
        if: github.event.inputs.confirm != 'BACKUP'
        run: |
          echo "You must type BACKUP to run this workflow."
          exit 1

      - name: Install PostgreSQL and GPG
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client gnupg

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          echo "Starting backup..."
          # تغییر خودکار پورت به 6543 (Transaction Pooler) برای عبور از IPv4
          SAFE_URL=$(echo "$DATABASE_URL" | sed 's/:5432/:6543/g' | sed 's/db\.bcmhykiruwbgovaxnwzr\.supabase\.co/aws-0-ap-southeast-1.pooler.supabase.com/g')
          
          echo "Connecting to database via IPv4 Pooler..."
          pg_dump "$SAFE_URL" -Fc -f backup.dump
          echo "Backup created."

      - name: Encrypt with GPG
        env:
          PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$PASSPHRASE" -c --cipher-algo AES256 backup.dump
          echo "Encrypted."

      - name: Verify GPG Encryption
        env:
          PASSPHRASE: ${{ secrets.BACKUP_GPG_PASSPHRASE }}
        run: |
          gpg --batch --yes --passphrase "$PASSPHRASE" -d backup.dump.gpg > /dev/null
          echo "GPG verification successful."

      - name: Cleanup
        run: |
          rm backup.dump
          echo "Done."

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-backup
          path: backup.dump.gpg
          retention-days: 7
